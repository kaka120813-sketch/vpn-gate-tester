<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>VPN Gate Tester</title><style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#131e30;--panel2:#1a2940;--line:#293a53;--muted:#9aabc2;--text:#f3f7ff;--green:#48d6a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:22px 18px 16px;background:linear-gradient(145deg,#142844,#101827);border-bottom:1px solid var(--line)}.wrap,main{max-width:900px;margin:auto}h1{font-size:23px;margin:0 0 6px}p{color:var(--muted);line-height:1.5}main{padding:15px 14px 40px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}.stat,.toolbar,.node{background:var(--panel);border:1px solid var(--line);border-radius:15px}.stat{padding:12px}.stat b{font-size:20px;display:block}.stat span,.muted{font-size:12px;color:var(--muted)}.toolbar{padding:12px;margin-bottom:12px;display:grid;gap:10px}.filters,.actions{display:flex;gap:8px;flex-wrap:wrap}select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}button{cursor:pointer}button.primary{background:#2765bd}.node{padding:13px;margin:9px 0}.top{display:flex;justify-content:space-between;gap:10px}.country{font-weight:700}.ip{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.pill{font-size:11px;padding:4px 7px;border-radius:99px;background:#203753;color:#b9d7ff;white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0}.metric{background:#0e1929;border-radius:9px;padding:8px 6px}.metric b{display:block;font-size:14px}.metric span{font-size:10px;color:var(--muted)}.foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.foot button{font-size:12px;padding:8px 10px}.empty{text-align:center;padding:35px 10px;color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.6;margin:14px 2px}@media(min-width:650px){.toolbar{grid-template-columns:1fr auto;align-items:center}.node{padding:16px}}
</style></head><body><header><div class="wrap"><h1>🌐 VPN Gate Tester</h1><p>公共节点 · 延迟检测 · 排序 · 配置导出</p><span class="muted">iPhone 优先 · Mobile-first</span></div></header><main>
<div class="stats"><div class="stat"><b id="total">—</b><span>节点总数</span></div><div class="stat"><b id="online">—</b><span>TCP 可连接</span></div><div class="stat"><b id="best">—</b><span>最低检测延迟</span></div></div>
<section class="toolbar"><div class="filters"><select id="country"><option value="">所有国家/地区</option></select><select id="sort"><option value="probe">按实测 TCP 延迟</option><option value="ping">按官方 Ping</option><option value="speed">按官方速度</option><option value="score">按质量分数</option><option value="sessions">按在线会话</option></select></div><div class="actions"><button class="primary" id="refresh">刷新节点</button><button id="test">一键检测 TCP 延迟</button></div><div class="muted" id="status">正在加载…</div></section><div id="list" class="empty">正在获取节点列表…</div>
<p class="note">说明：实测值是网站服务器到节点 TCP 端口的连接耗时，不是 iPhone 的 ICMP Ping，也不是 VPN 隧道延迟。官方速度和 Ping 为 VPN Gate 发布的数据。普通网页不能自行创建或控制 iOS VPN 隧道，因此不能直接测量 iPhone 经 VPN 隧道的真实上下行速度。公共中继由志愿者运营，请谨慎处理隐私信息。</p></main>
<script>
let nodes=[],tests={};const $=x=>document.getElementById(x),fmt=(x,d=0)=>Number(x||0).toLocaleString("zh-CN",{maximumFractionDigits:d}),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){ $("refresh").disabled=true;$("status").textContent="正在获取官方节点…";try{let r=await fetch("/api/nodes");if(!r.ok)throw Error((await r.json()).detail);let d=await r.json();nodes=d.nodes;tests={};$("total").textContent=fmt(nodes.length);let cs=[...new Set(nodes.map(n=>n.country))].sort();$("country").innerHTML='<option value="">所有国家/地区</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join("");$("status").textContent="更新于 "+new Date(d.updatedAt).toLocaleString();render();}catch(e){$("status").textContent="加载失败："+e.message;$("list").textContent="暂时无法获取节点，请稍后重试。"}finally{$("refresh").disabled=false}}
function render(){let a=nodes.filter(n=>!$("country").value||n.country===$("country").value),s=$("sort").value;a.sort((x,y)=>s==="probe"?(tests[x.id]?.ms??Infinity)-(tests[y.id]?.ms??Infinity):s==="ping"?(x.ping||Infinity)-(y.ping||Infinity):s==="speed"?y.speedBps-x.speedBps:s==="score"?y.score-x.score:y.sessions-x.sessions);$("list").innerHTML=a.length?a.map(n=>{let t=tests[n.id];return `<article class="node"><div class="top"><div><div class="country">${esc(n.country)} <span class="pill">${esc(n.protocol||"OpenVPN")}</span></div><div class="ip">${esc(n.host)} · ${esc(n.ip)} · 端口 ${n.port||"—"}</div></div><span class="pill">${t?(t.ok?"TCP "+t.ms+" ms":"不可连接"):"未检测"}</span></div><div class="metrics"><div class="metric"><b>${t?(t.ok?t.ms+" ms":"—"):(n.ping?n.ping+" ms":"—")}</b><span>${t?"实测 TCP":"官方 Ping"}</span></div><div class="metric"><b>${fmt(n.speedBps/1e6,1)}</b><span>官方 Mbps</span></div><div class="metric"><b>${fmt(n.sessions)}</b><span>在线会话</span></div><div class="metric"><b>${fmt(n.score)}</b><span>质量分数</span></div></div><div class="foot"><button onclick="config('${encodeURIComponent(n.id)}')">导出 .ovpn</button><span class="ip">${n.configAvailable?"有配置":"无配置"}</span></div></article>`}).join(""):'<div class="empty">没有符合条件的节点</div>'}
async function testAll(){let a=nodes.filter(n=>n.port).slice(0,80);$("test").disabled=true;for(let i=0;i<a.length;i+=10){$("status").textContent=`检测进度 ${Math.min(i+10,a.length)} / ${a.length}`;try{let r=await fetch("/api/probe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nodes:a.slice(i,i+10).map(n=>({id:n.id,ip:n.ip,port:n.port}))})});let d=await r.json();d.results.forEach(x=>tests[x.id]=x)}catch{}render()}let ok=Object.values(tests).filter(x=>x.ok);$("online").textContent=fmt(ok.length);$("best").textContent=ok.length?Math.min(...ok.map(x=>x.ms))+" ms":"—";$("status").textContent=`检测完成：${ok.length} 个端口可连接（最多检测 80 个）`;$("test").disabled=false;render()}
async function config(id){try{let r=await fetch("/api/config/"+id);if(!r.ok)throw Error(await r.text());let b=await r.blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="vpngate.ovpn";a.click();URL.revokeObjectURL(a.href)}catch(e){alert("导出失败："+e.message)}}
$("refresh").onclick=load;$("test").onclick=testAll;$("country").onchange=render;$("sort").onchange=render;load();
</script></body></html>
